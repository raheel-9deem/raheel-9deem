<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#0d2b3e;#0d1117" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1F6FEB">
        <animate attributeName="stop-color" values="#1F6FEB;#00F7FF;#1F6FEB" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      font-size: 54px;
      font-weight: 700;
      fill: #00F7FF;
      opacity: 0;
      animation: fadeIn 1.4s ease-out forwards;
    }
    .subtitle {
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #C9D1D9;
      opacity: 0;
      animation: fadeIn 1.4s ease-out 0.6s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .wave {
      animation: waveMove 8s ease-in-out infinite;
    }
    @keyframes waveMove {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(-60px); }
      100% { transform: translateX(0); }
    }
  </style>

  <rect width="1200" height="200" fill="url(#bgGrad)"/>

  <path class="wave" d="M0,170 C150,140 300,190 450,165 C600,140 750,185 900,160 C1050,140 1150,175 1200,160 L1200,200 L0,200 Z" fill="url(#waveGrad)"/>

  <text x="80" y="95" class="title">Raheel Nadeem</text>
  <text x="80" y="130" class="subtitle">Freelance WordPress Developer  |  SEO &amp; Automation</text>
</svg>
